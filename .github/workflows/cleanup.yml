name: Delete old videos

on:
  schedule:
    - cron: "23 6 * * *"   # once a day
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 cleanup.py
      - run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "exotic-punch-agent"
            git config user.email "agent@users.noreply.github.com"
            git add -A && git commit -m "Delete videos older than 7 days after posting" && git push
          fi
